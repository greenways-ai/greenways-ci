name: _V2 frontend

on:
  workflow_call:
    inputs:
      source_repository: {required: true, type: string}
      source_ref: {required: true, type: string}
      status_context: {required: true, type: string}
      report_status: {required: false, default: false, type: boolean}
    secrets:
      GH_TOKEN: {required: true}

permissions:
  contents: read

jobs:
  build:
    name: main frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Validate frontend workspace
        id: validate
        continue-on-error: true
        working-directory: v2/main
        run: |
          yarn install --immutable
          yarn typecheck
          yarn test:ci
          yarn build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-frontend-${{ github.run_id }}
          path: |
            v2/main/coverage
            v2/main/apps/gw-space/.next
            v2/main/apps/gw-space-storybook/storybook-static
          if-no-files-found: warn
          retention-days: 14
      - if: always() && inputs.report_status
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          STATUS_CONTEXT: ${{ inputs.status_context }}
          RESULT: ${{ steps.validate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({owner, repo, sha: process.env.SOURCE_SHA, state: passed ? 'success' : 'failure', context: process.env.STATUS_CONTEXT, description: passed ? 'Frontend passed' : 'Frontend failed', target_url: process.env.RUN_URL});
      - if: always()
        env:
          RESULT: ${{ steps.validate.outcome }}
        run: test "$RESULT" = success

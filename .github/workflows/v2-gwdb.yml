name: Greenways v2 gwdb

on:
  repository_dispatch:
    types: [v2-changed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit in greenways-ai/v2
        required: true
        default: main
        type: string
  pull_request:
    paths:
      - '.github/workflows/v2-gwdb.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: v2-gwdb-${{ github.event.client_payload.sha || inputs.source_ref || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: greenways-ai/v2
  SOURCE_REF: ${{ github.event.client_payload.sha || inputs.source_ref || 'main' }}

jobs:
  gwdb:
    name: Compile backend and test gwdb
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out notified v2 revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2

      - name: Record source revision
        id: source
        working-directory: v2
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          git show --no-patch --format='Source commit: %H%nSubject: %s'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: latest

      - name: Cache Leiningen dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: v2-lein-${{ runner.os }}-${{ hashFiles('v2/backend/project.clj') }}
          restore-keys: |
            v2-lein-${{ runner.os }}-

      - name: Set up Supabase CLI for the gw-dev test scaffold
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Remove unavailable local-only Lein plugin
        working-directory: v2/backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('project.clj')
          source = path.read_text()
          updated, count = re.subn(
              r'\s*\[lein-mcp\s+"0\.1\.0-SNAPSHOT"\]',
              '',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected one lein-mcp 0.1.0-SNAPSHOT plugin entry')
          path.write_text(updated)
          PY

      - name: Compile backend
        id: compile
        continue-on-error: true
        working-directory: v2/backend
        run: |
          set -o pipefail
          lein check 2>&1 | tee lein-check.log

      - name: Run gwdb tests
        id: gwdb
        continue-on-error: true
        working-directory: v2/backend
        run: |
          set -o pipefail
          lein test :in gwdb 2>&1 | tee gwdb-test.log

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-gwdb-${{ steps.source.outputs.sha }}
          path: |
            v2/backend/lein-check.log
            v2/backend/gwdb-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write run summary
        if: always()
        env:
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          GWDB_RESULT: ${{ steps.gwdb.outcome }}
        run: |
          {
            echo '## Greenways v2 gwdb'
            echo
            echo "- Repository: $SOURCE_REPOSITORY"
            echo "- Requested ref: $SOURCE_REF"
            echo "- Resolved SHA: ${{ steps.source.outputs.sha }}"
            echo "- Backend compile: $COMPILE_RESULT"
            echo "- gwdb tests: $GWDB_RESULT"
            echo '- Database lifecycle: owned by the gw-dev test scaffold'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce compile and test results
        if: always()
        env:
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          GWDB_RESULT: ${{ steps.gwdb.outcome }}
        run: |
          if [[ "$COMPILE_RESULT" != success || "$GWDB_RESULT" != success ]]; then
            echo 'Backend compilation or gwdb tests failed.' >&2
            exit 1
          fi

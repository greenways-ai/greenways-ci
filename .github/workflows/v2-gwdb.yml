name: Greenways v2 gwdb

on:
  repository_dispatch:
    types: [v2-changed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit in greenways-ai/v2
        required: true
        default: main
        type: string
  pull_request:
    paths:
      - '.github/workflows/v2-gwdb.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: v2-gwdb-${{ github.event.client_payload.sha || inputs.source_ref || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: greenways-ai/v2
  SOURCE_REF: ${{ github.event.client_payload.sha || inputs.source_ref || 'main' }}
  CI_IMAGE: ghcr.io/zcaudate-xyz/infra-foundation-dev:ci

jobs:
  gwdb:
    name: Compile backend and test gwdb
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out notified v2 revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2

      - name: Check out Foundation dependency source
        uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          token: ${{ secrets.GH_TOKEN }}
          path: foundation-base

      - name: Record source revisions
        id: source
        run: |
          source_sha=$(git -C v2 rev-parse HEAD)
          foundation_sha=$(git -C foundation-base rev-parse HEAD)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "foundation_sha=$foundation_sha" >> "$GITHUB_OUTPUT"
          echo "ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          git -C v2 show --no-patch --format='Source commit: %H%nSubject: %s'
          git -C foundation-base show --no-patch --format='Foundation commit: %H%nSubject: %s'

      - name: Pull shared CI image
        run: docker pull "$CI_IMAGE"

      - name: Compile backend
        id: compile
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "$CI_IMAGE" \
            bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend && lein check 2>&1 | tee lein-check.log'

      - name: Run gwdb tests
        id: gwdb
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "$CI_IMAGE" \
            bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend && lein test :in gwdb 2>&1 | tee gwdb-test.log'

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-gwdb-${{ steps.source.outputs.sha }}
          path: |
            v2/backend/lein-check.log
            v2/backend/gwdb-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write run summary
        if: always()
        env:
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          GWDB_RESULT: ${{ steps.gwdb.outcome }}
        run: |
          {
            echo '## Greenways v2 gwdb'
            echo
            echo "- Repository: $SOURCE_REPOSITORY"
            echo "- Requested ref: $SOURCE_REF"
            echo "- Resolved SHA: ${{ steps.source.outputs.sha }}"
            echo "- Foundation SHA: ${{ steps.source.outputs.foundation_sha }}"
            echo "- CI image: $CI_IMAGE"
            echo "- Backend compile: $COMPILE_RESULT"
            echo "- gwdb tests: $GWDB_RESULT"
            echo '- Dependencies: prepared by v2 make deps-checkouts'
            echo '- Database lifecycle: owned by the gw-dev test scaffold'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce compile and test results
        if: always()
        env:
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          GWDB_RESULT: ${{ steps.gwdb.outcome }}
        run: |
          if [[ "$COMPILE_RESULT" != success || "$GWDB_RESULT" != success ]]; then
            echo 'Backend compilation or gwdb tests failed.' >&2
            exit 1
          fi

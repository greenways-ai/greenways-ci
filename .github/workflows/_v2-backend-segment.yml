name: _V2 backend segment

on:
  workflow_call:
    inputs:
      source_repository: {required: true, type: string}
      source_ref: {required: true, type: string}
      source_run_url: {required: false, default: '', type: string}
      correlation_id: {required: true, type: string}
      selectors: {required: true, type: string}
      segment_name: {required: true, type: string}
      status_context: {required: true, type: string}
      artifact_suffix: {required: true, type: string}
      verify_generated: {required: false, default: false, type: boolean}
      report_status: {required: false, default: false, type: boolean}
    secrets:
      GH_TOKEN: {required: true}

permissions:
  contents: read

env:
  CI_IMAGE: ghcr.io/zcaudate-xyz/infra-foundation-dev:ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: ${{ inputs.segment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Link source check to this pipeline
        if: inputs.report_status
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          STATUS_CONTEXT: ${{ inputs.status_context }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            await github.rest.repos.createCommitStatus({owner, repo, sha: process.env.SOURCE_SHA, state: 'pending', context: process.env.STATUS_CONTEXT, description: 'Running in central Greenways CI', target_url: process.env.RUN_URL});

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2

      - name: Resolve pinned Foundation revision
        id: foundation
        run: echo "sha=$(git -C v2 ls-tree HEAD ref/foundation | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          ref: ${{ steps.foundation.outputs.sha }}
          token: ${{ secrets.GH_TOKEN }}
          path: foundation-base

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Prepare dependencies
        id: prepare
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.m2"
          docker pull "$CI_IMAGE"
          docker run --rm --network host -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -v "$HOME/.m2:/root/.m2" "$CI_IMAGE" bash -lc 'set -o pipefail; cd foundation-base && lein install 2>&1 | tee foundation-install.log'

      - name: Compile backend
        id: compile
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -v "$HOME/.m2:/root/.m2" -v /var/run/docker.sock:/var/run/docker.sock:ro "$CI_IMAGE" bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend && lein check 2>&1 | tee lein-check.log'

      - name: Run slice tests
        id: tests
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        env:
          SELECTORS: ${{ inputs.selectors }}
          TEST_LOG: ${{ inputs.artifact_suffix }}-test.log
        run: |
          docker run --rm --network host -e SELECTORS -e TEST_LOG -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -v "$HOME/.m2:/root/.m2" -v /var/run/docker.sock:/var/run/docker.sock:ro "$CI_IMAGE" bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend; : > "$TEST_LOG"; for selector in $SELECTORS; do lein test :in "$selector" 2>&1 | tee -a "$TEST_LOG" || exit 1; done'

      - name: Verify generated artifacts
        id: generated
        if: steps.tests.outcome == 'success' && inputs.verify_generated
        continue-on-error: true
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -v "$HOME/.m2:/root/.m2" "$CI_IMAGE" bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend && lein rpc && lein link && lein sql'
          git -C v2 diff --exit-code -- backend/src/gwdb/rpc backend/src/gwdb/core/trigger_metadata.clj backend/src/gwlink/backbone/rpc.clj backend/src/gwlink/backbone/view.clj main/sql | tee v2/backend/generated-diff.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-${{ inputs.artifact_suffix }}-${{ github.run_id }}
          path: |
            foundation-base/foundation-install.log
            v2/backend/lein-check.log
            v2/backend/${{ inputs.artifact_suffix }}-test.log
            v2/backend/generated-diff.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report source result
        if: always() && inputs.report_status
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          STATUS_CONTEXT: ${{ inputs.status_context }}
          PREPARE: ${{ steps.prepare.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          GENERATED: ${{ steps.generated.outcome }}
          VERIFY_GENERATED: ${{ inputs.verify_generated }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            const passed = process.env.PREPARE === 'success' && process.env.COMPILE === 'success' && process.env.TESTS === 'success' && (process.env.VERIFY_GENERATED !== 'true' || process.env.GENERATED === 'success');
            await github.rest.repos.createCommitStatus({owner, repo, sha: process.env.SOURCE_SHA, state: passed ? 'success' : 'failure', context: process.env.STATUS_CONTEXT, description: passed ? 'Slice passed' : 'Slice failed', target_url: process.env.RUN_URL});

      - name: Enforce result
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          GENERATED: ${{ steps.generated.outcome }}
          VERIFY_GENERATED: ${{ inputs.verify_generated }}
        run: test "$PREPARE" = success && test "$COMPILE" = success && test "$TESTS" = success && { test "$VERIFY_GENERATED" != true || test "$GENERATED" = success; }

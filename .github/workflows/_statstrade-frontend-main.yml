name: _Statstrade V2 main frontend release

on:
  workflow_call:
    inputs:
      correlation_id: {required: true, type: string}
      source_repository: {required: true, type: string}
      source_sha: {required: true, type: string}
      secrets_ref: {required: false, default: main, type: string}
    secrets:
      GH_TOKEN: {required: true}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy V2 main to next.statstrade.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: statstrade-next
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SECRETS_REF: ${{ inputs.secrets_ref }}
    steps:
      - name: Check out trusted orchestration
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Check out exact V2 source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - id: foundation
        run: echo "sha=$(git -C source ls-tree HEAD ref/foundation | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Check out pinned foundation source
        uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          ref: ${{ steps.foundation.outputs.sha }}
          token: ${{ secrets.GH_TOKEN }}
          path: source/ref/foundation
          persist-credentials: false

      - name: Verify exact main identity
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags \
            "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPOSITORY}.git" \
            main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"

      - name: Check out pinned frontend configuration
        id: secret-revision
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/dot-secrets"
          git init -q "$directory"
          git -C "$directory" fetch --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/statstrade-dev/dot-secrets.git" \
            "$SECRETS_REF"
          git -C "$directory" checkout -q --detach FETCH_HEAD
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$directory" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Load allowlisted frontend provider configuration
        id: provider-secrets
        run: |
          set -euo pipefail
          secrets_directory="${{ steps.secret-revision.outputs.directory }}"
          config_directory="$RUNNER_TEMP/statstrade-next-frontend-config"
          if [[ -d "$secrets_directory/v2/statstrade/frontend" ]]; then
            node ci/.github/scripts/load-env-files.mjs \
              "$secrets_directory/v2/statstrade/frontend" \
              ci/.github/config/statstrade-next-frontend-secrets.json
          elif [[ -f "$secrets_directory/statstrade/prod/netlify.env" ]]; then
            install -d -m 700 "$config_directory"
            awk -F= '
              $1 ~ /^(NETLIFY_AUTH_TOKEN|NETLIFY_ACCOUNT_SLUG|NETLIFY_NEXT_SITE_ID|NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY)$/ {print}
            ' "$secrets_directory/statstrade/prod/netlify.env" > "$config_directory/netlify.env"
            node ci/.github/scripts/load-env-files.mjs \
              "$config_directory" \
              ci/.github/config/statstrade-next-frontend-secrets.json
          else
            echo "No supported Statstrade frontend configuration found." >&2
            exit 1
          fi

      - name: Resolve exact next Netlify site
        id: next-site
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.provider-secrets.outputs.NETLIFY_AUTH_TOKEN }}
          NETLIFY_ACCOUNT_SLUG: ${{ steps.provider-secrets.outputs.NETLIFY_ACCOUNT_SLUG }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          sites_json="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites?per_page=100")"
          site_json="$(jq -c '
            map(select(
              .custom_domain == "next.statstrade.io" or
              .name == "next-statstrade-io" or
              .subdomain == "next-statstrade-io" or
              .ssl_url == "https://next.statstrade.io"
            ))
            | first // empty
          ' <<<"$sites_json")"
          test -n "$site_json" || {
            echo "Netlify site for next.statstrade.io was not found" >&2
            exit 1
          }
          if [[ -n "$NETLIFY_ACCOUNT_SLUG" ]]; then
            test "$(jq -r .account_slug <<<"$site_json")" = "$NETLIFY_ACCOUNT_SLUG"
          fi
          echo "id=$(jq -r .id <<<"$site_json")" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build immutable Netlify output
        working-directory: source
        env:
          DEPLOY_CONTEXT: branch:main
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.provider-secrets.outputs.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.provider-secrets.outputs.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ steps.provider-secrets.outputs.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]]; then
            export NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY"
          fi
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          (cd ref/foundation && ./lein install)
          make deps-checkouts
          corepack enable
          (cd main/js && corepack yarn install --immutable)
          cp main/js/apps/statstrade/netlify.toml netlify.toml
          trap 'rm -f netlify.toml' EXIT
          npx --yes netlify-cli@26.2.0 build --offline \
            --context "$DEPLOY_CONTEXT"
          rm -rf .netlify/static .netlify/functions
          rm -rf main/js/apps/statstrade/.netlify/function-source
          rm -rf main/js/apps/statstrade/.netlify/functions
          mkdir -p .netlify/static
          mkdir -p main/js/apps/statstrade/.netlify/function-source
          mkdir -p main/js/apps/statstrade/.netlify/functions
          cp -R main/js/apps/statstrade/build/. .netlify/static/
          cp -R main/js/apps/statstrade/.netlify/functions-internal/. \
            main/js/apps/statstrade/.netlify/function-source/
          cp -R main/js/apps/statstrade/netlify/functions/. \
            main/js/apps/statstrade/.netlify/function-source/
          (
            cd main/js
            npx --yes netlify-cli@26.2.0 functions:build \
              --filter @statstrade/web \
              --src apps/statstrade/.netlify/function-source \
              --functions apps/statstrade/.netlify/functions
          )
          cp -R main/js/apps/statstrade/.netlify/functions/. .netlify/functions/
          test -f .netlify/static/generated/gwlink-remote.js
          test -f .netlify/static/workers/gwlink-sharedworker-xtdb.js
          test -f .netlify/functions/manifest.json
          test -f .netlify/functions/sveltekit-render.zip

      - name: Package immutable build
        id: artifact
        working-directory: source
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/statstrade-frontend.tgz" \
            .netlify main/js/apps/statstrade/netlify.toml
          digest="$(sha256sum "$RUNNER_TEMP/statstrade-frontend.tgz" | cut -d' ' -f1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy exact build to next
        id: deploy
        working-directory: source
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.provider-secrets.outputs.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.next-site.outputs.id }}
        run: |
          set -euo pipefail
          cp main/js/apps/statstrade/netlify.toml netlify.toml
          trap 'rm -f netlify.toml' EXIT
          npx --yes netlify-cli@26.2.0 deploy --no-build --prod \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --dir .netlify/static --functions .netlify/functions \
            --message "V2 main $SOURCE_SHA" --json > "$RUNNER_TEMP/deploy.json"
          echo "id=$(jq -r '.deploy_id // .deployId // .id' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.deploy_url // .deployUrl // .url' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_OUTPUT"

      - name: Smoke-test unpublished deploy
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 "$DEPLOY_URL" > /dev/null

      - name: Write release manifest
        env:
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          NETLIFY_SITE_ID: ${{ steps.next-site.outputs.id }}
          SECRETS_SHA: ${{ steps.secret-revision.outputs.sha }}
        run: |
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg artifactSha256 "$ARTIFACT_SHA256" \
            --arg netlifyDeployId "$DEPLOY_ID" \
            --arg netlifySiteId "$NETLIFY_SITE_ID" \
            --arg deployUrl "$DEPLOY_URL" \
            --arg secretsSha "$SECRETS_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg createdAt "$(date -u +%FT%TZ)" \
            '{version:1,channel:"next",hostname:"next.statstrade.io",sourceSha:$sourceSha,artifactSha256:$artifactSha256,netlifyDeployId:$netlifyDeployId,netlifySiteId:$netlifySiteId,deployUrl:$deployUrl,secretsSha:$secretsSha,runId:$runId,runAttempt:$runAttempt,createdAt:$createdAt}' \
            > "$RUNNER_TEMP/frontend-release.json"

      - name: Retain promotion artifact and manifest
        uses: actions/upload-artifact@v4
        with:
          name: statstrade-frontend-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/statstrade-frontend.tgz
            ${{ runner.temp }}/frontend-release.json
          if-no-files-found: error
          retention-days: 90

name: Promote Statstrade V2 frontend to production
run-name: Production ${{ inputs.source_sha }} from artifact run ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact V2 main SHA already deployed to next.statstrade.io
        required: true
        type: string
      source_run_id:
        description: Greenways CI run containing the immutable frontend artifact
        required: true
        type: string
      secrets_ref:
        description: Exact or explicitly approved statstrade-dev/dot-secrets ref
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: statstrade-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: statstrade-production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SECRETS_REF: ${{ inputs.secrets_ref }}
    steps:
      - name: Check out trusted orchestration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false

      - name: Verify source and immutable artifact eligibility
        id: preflight
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const {verifyProductionSource} = require(`${process.env.GITHUB_WORKSPACE}/ci/.github/scripts/statstrade-production.cjs`);
            const result = await verifyProductionSource({
              github,
              sourceSha: process.env.SOURCE_SHA,
              runId: process.env.SOURCE_RUN_ID,
              secretsRef: process.env.SECRETS_REF,
            });
            core.setOutput('source-main-sha', result.mainSha);
            core.setOutput('artifact-id', String(result.artifactId));
            core.setOutput('source-run-attempt', result.runAttempt);

      - name: Check out exact V2 source
        uses: actions/checkout@v4
        with:
          repository: statstrade-dev/v2
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Verify checked-out source identity
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download immutable next artifact
        uses: actions/download-artifact@v4
        with:
          name: statstrade-frontend-${{ inputs.source_sha }}
          path: release
          github-token: ${{ secrets.GH_TOKEN }}
          repository: greenways-ai/greenways-ci
          run-id: ${{ inputs.source_run_id }}

      - name: Validate release identity and digest
        env:
          SOURCE_RUN_ATTEMPT: ${{ steps.preflight.outputs.source-run-attempt }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const {validateReleaseManifest} = require('./ci/.github/scripts/statstrade-production.cjs');
          const manifest = JSON.parse(fs.readFileSync('release/frontend-release.json', 'utf8'));
          const digest = crypto.createHash('sha256')
            .update(fs.readFileSync('release/statstrade-frontend.tgz')).digest('hex');
          validateReleaseManifest(manifest, {
            sourceSha: process.env.SOURCE_SHA,
            runId: process.env.SOURCE_RUN_ID,
            runAttempt: process.env.SOURCE_RUN_ATTEMPT,
            artifactSha256: digest,
          });
          NODE

      - name: Configure dot-secrets deploy key
        env:
          DOT_SECRETS_SSH_KEY: ${{ secrets.DOT_SECRETS_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/dot-secrets-key"
          known_hosts="$RUNNER_TEMP/dot-secrets-known-hosts"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DOT_SECRETS_SSH_KEY" > "$key"
          ssh-keyscan -H github.com > "$known_hosts"
          echo "DOT_SECRETS_GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Check out pinned frontend configuration
        id: secret-revision
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/dot-secrets"
          git init -q "$directory"
          git -C "$directory" remote add origin git@github.com:statstrade-dev/dot-secrets.git
          GIT_SSH_COMMAND="$DOT_SECRETS_GIT_SSH_COMMAND" git -C "$directory" fetch --depth=1 origin "$SECRETS_REF"
          git -C "$directory" checkout -q --detach FETCH_HEAD
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$directory" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Load allowlisted frontend provider configuration
        id: provider-secrets
        run: |
          node ci/.github/scripts/load-env-files.mjs \
            "${{ steps.secret-revision.outputs.directory }}/v2/statstrade/frontend" \
            ci/.github/config/statstrade-frontend-secrets.json

      - name: Resolve exact www Netlify site
        id: www-site
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.provider-secrets.outputs.NETLIFY_AUTH_TOKEN }}
          NETLIFY_ACCOUNT_SLUG: ${{ steps.provider-secrets.outputs.NETLIFY_ACCOUNT_SLUG }}
          NETLIFY_WWW_SITE_ID: ${{ steps.provider-secrets.outputs.NETLIFY_WWW_SITE_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            https://api.netlify.com/api/v1/sites/www-statstrade-io \
            > "$RUNNER_TEMP/www-site.json"
          test "$(jq -r .name "$RUNNER_TEMP/www-site.json")" = www-statstrade-io
          test "$(jq -r .id "$RUNNER_TEMP/www-site.json")" = "$NETLIFY_WWW_SITE_ID"
          if [[ -n "$NETLIFY_ACCOUNT_SLUG" ]]; then
            test "$(jq -r .account_slug "$RUNNER_TEMP/www-site.json")" = "$NETLIFY_ACCOUNT_SLUG"
          fi
          echo "id=$(jq -r .id "$RUNNER_TEMP/www-site.json")" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore immutable build
        working-directory: source
        run: tar -xzf "$GITHUB_WORKSPACE/release/statstrade-frontend.tgz"

      - name: Deploy exact build to www
        id: deploy
        working-directory: source
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.provider-secrets.outputs.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.www-site.outputs.id }}
        run: |
          set -euo pipefail
          # Match the next-channel deploy layout, including packaged redirects.
          cp main/js/apps/statstrade/netlify.toml netlify.toml
          trap 'rm -f netlify.toml' EXIT
          npx --yes netlify-cli@26.2.0 deploy --no-build --prod \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --dir .netlify/static --functions .netlify/functions \
            --message "V2 production $SOURCE_SHA" --json > "$RUNNER_TEMP/deploy.json"
          echo "id=$(jq -r '.deploy_id // .deployId // .id' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.deploy_url // .deployUrl // .url' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_OUTPUT"

      - name: Smoke-test production deploy
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 "$DEPLOY_URL" > /dev/null

      - name: Advance protected prod branch to deployed SHA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const owner = 'statstrade-dev';
            const repo = 'v2';
            const sha = process.env.SOURCE_SHA;
            try {
              const current = await github.rest.git.getRef({owner, repo, ref: 'heads/prod'});
              const comparison = await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: `${current.data.object.sha}...${sha}`});
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                core.setFailed('prod can only advance to a descendant of its current SHA.');
                return;
              }
              await github.rest.git.updateRef({owner, repo, ref: 'heads/prod', sha, force: false});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: 'refs/heads/prod', sha});
            }

      - name: Write production manifest
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          NETLIFY_SITE_ID: ${{ steps.www-site.outputs.id }}
          SECRETS_SHA: ${{ steps.secret-revision.outputs.sha }}
          SOURCE_MAIN_SHA: ${{ steps.preflight.outputs.source-main-sha }}
          SOURCE_ARTIFACT_ID: ${{ steps.preflight.outputs.artifact-id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.preflight.outputs.source-run-attempt }}
        run: |
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceRunId "$SOURCE_RUN_ID" \
            --arg sourceMainSha "$SOURCE_MAIN_SHA" \
            --arg sourceArtifactId "$SOURCE_ARTIFACT_ID" \
            --arg sourceRunAttempt "$SOURCE_RUN_ATTEMPT" \
            --arg artifactSha256 "$(jq -r .artifactSha256 release/frontend-release.json)" \
            --arg nextDeployId "$(jq -r .netlifyDeployId release/frontend-release.json)" \
            --arg productionDeployId "$DEPLOY_ID" \
            --arg netlifySiteId "$NETLIFY_SITE_ID" \
            --arg deployUrl "$DEPLOY_URL" \
            --arg secretsSha "$SECRETS_SHA" \
            --arg createdAt "$(date -u +%FT%TZ)" \
            '{version:1,channel:"production",hostname:"www.statstrade.io",sourceSha:$sourceSha,sourceRunId:$sourceRunId,sourceMainSha:$sourceMainSha,sourceArtifactId:$sourceArtifactId,sourceRunAttempt:$sourceRunAttempt,artifactSha256:$artifactSha256,nextDeployId:$nextDeployId,productionDeployId:$productionDeployId,netlifySiteId:$netlifySiteId,deployUrl:$deployUrl,secretsSha:$secretsSha,createdAt:$createdAt}' \
            > "$RUNNER_TEMP/production-release.json"

      - name: Retain production manifest
        uses: actions/upload-artifact@v4
        with:
          name: statstrade-production-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/production-release.json
          if-no-files-found: error
          retention-days: 90

name: Greenways v2 CI

on:
  repository_dispatch:
    types: [v2-ci-requested]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit in greenways-ai/v2
        required: true
        default: main
        type: string
      run_core:
        description: Run gwdb.core tests
        required: true
        default: true
        type: boolean
      run_rpc:
        description: Run gwdb.rpc tests
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/v2-ci.yml'
      - '.github/workflows/_v2-gwdb-segment.yml'

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.event.client_payload.correlation_id || github.event.client_payload.source_sha || inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gwdb-core:
    name: gwdb.core pipeline
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_core) ||
      github.event.client_payload.segments.gwdb_core == true
    uses: ./.github/workflows/_v2-gwdb-segment.yml
    with:
      source_repository: ${{ github.event.client_payload.source_repository || 'greenways-ai/v2' }}
      source_ref: ${{ github.event.client_payload.source_sha || inputs.source_ref || 'main' }}
      source_run_url: ${{ github.event.client_payload.source_run_url || '' }}
      source_run_id: ${{ format('{0}', github.event.client_payload.source_run_id || '') }}
      source_run_attempt: ${{ format('{0}', github.event.client_payload.source_run_attempt || '') }}
      pull_request_number: ${{ format('{0}', github.event.client_payload.pull_request_number || '') }}
      correlation_id: ${{ github.event.client_payload.correlation_id || format('{0}:{1}:{2}', github.event_name, github.run_id, github.run_attempt) }}
      selector: gwdb.core
      segment_name: gwdb.core
      status_context: greenways-ci/gwdb-core
      artifact_suffix: gwdb-core
      report_status: ${{ github.event_name == 'repository_dispatch' }}
    secrets: inherit

  gwdb-rpc:
    name: gwdb.rpc pipeline
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_rpc) ||
      github.event.client_payload.segments.gwdb_rpc == true
    uses: ./.github/workflows/_v2-gwdb-segment.yml
    with:
      source_repository: ${{ github.event.client_payload.source_repository || 'greenways-ai/v2' }}
      source_ref: ${{ github.event.client_payload.source_sha || inputs.source_ref || 'main' }}
      source_run_url: ${{ github.event.client_payload.source_run_url || '' }}
      source_run_id: ${{ format('{0}', github.event.client_payload.source_run_id || '') }}
      source_run_attempt: ${{ format('{0}', github.event.client_payload.source_run_attempt || '') }}
      pull_request_number: ${{ format('{0}', github.event.client_payload.pull_request_number || '') }}
      correlation_id: ${{ github.event.client_payload.correlation_id || format('{0}:{1}:{2}', github.event_name, github.run_id, github.run_attempt) }}
      selector: gwdb.rpc
      segment_name: gwdb.rpc
      status_context: greenways-ci/gwdb-rpc
      artifact_suffix: gwdb-rpc
      report_status: ${{ github.event_name == 'repository_dispatch' }}
    secrets: inherit

name: Greenways v2 CI

on:
  repository_dispatch:
    types: [v2-ci-requested]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit in greenways-ai/v2
        required: true
        default: main
        type: string
      run_core:
        description: Run gwdb.core tests
        required: true
        default: true
        type: boolean
      run_rpc:
        description: Run gwdb.rpc tests
        required: true
        default: true
        type: boolean
      run_docs:
        description: Build Docusaurus documentation
        required: true
        default: true
        type: boolean
      publish_docs:
        description: Publish documentation to GitHub Pages
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/v2-ci.yml'
      - 'README.md'
      - 'Makefile'
      - 'docs/v2-documentation-publishing.md'

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.event.client_payload.correlation_id || github.event.client_payload.source_sha || inputs.source_ref || github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: ghcr.io/zcaudate-xyz/infra-foundation-dev:ci

jobs:
  gwdb:
    name: Compile and run requested gwdb segments
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_core || inputs.run_rpc)) ||
      github.event.client_payload.segments.gwdb_core == true ||
      github.event.client_payload.segments.gwdb_rpc == true
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve correlated request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.source_ref }}
          INPUT_CORE: ${{ inputs.run_core }}
          INPUT_RPC: ${{ inputs.run_rpc }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          PAYLOAD_REF: ${{ github.event.client_payload.source_sha || github.event.client_payload.source_ref }}
          PAYLOAD_CORE: ${{ github.event.client_payload.segments.gwdb_core }}
          PAYLOAD_RPC: ${{ github.event.client_payload.segments.gwdb_rpc }}
          PAYLOAD_CORRELATION: ${{ github.event.client_payload.correlation_id }}
          PAYLOAD_SOURCE_RUN_URL: ${{ github.event.client_payload.source_run_url }}
          PAYLOAD_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          PAYLOAD_SOURCE_RUN_ATTEMPT: ${{ github.event.client_payload.source_run_attempt }}
          PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pull_request_number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            source_repository="greenways-ai/v2"
            source_ref="${INPUT_REF:-main}"
            run_core="${INPUT_CORE:-true}"
            run_rpc="${INPUT_RPC:-true}"
            correlation_id="manual:${source_ref}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            source_run_url=""
            source_run_id=""
            source_run_attempt=""
            pr_number=""
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            source_repository="greenways-ai/v2"
            source_ref="main"
            run_core=true
            run_rpc=true
            correlation_id="central-pr:${GITHUB_SHA}:${GITHUB_RUN_ID}"
            source_run_url=""
            source_run_id=""
            source_run_attempt=""
            pr_number=""
          else
            source_repository="${PAYLOAD_REPOSITORY:-greenways-ai/v2}"
            source_ref="${PAYLOAD_REF:-main}"
            run_core="${PAYLOAD_CORE:-false}"
            run_rpc="${PAYLOAD_RPC:-false}"
            correlation_id="${PAYLOAD_CORRELATION:-dispatch:${source_ref}:${GITHUB_RUN_ID}}"
            source_run_url="$PAYLOAD_SOURCE_RUN_URL"
            source_run_id="$PAYLOAD_SOURCE_RUN_ID"
            source_run_attempt="$PAYLOAD_SOURCE_RUN_ATTEMPT"
            pr_number="$PAYLOAD_PR_NUMBER"
          fi

          [[ "$run_core" == "true" ]] || run_core=false
          [[ "$run_rpc" == "true" ]] || run_rpc=false

          {
            echo "source-repository=$source_repository"
            echo "source-ref=$source_ref"
            echo "run-core=$run_core"
            echo "run-rpc=$run_rpc"
            echo "correlation-id=$correlation_id"
            echo "source-run-url=$source_run_url"
            echo "source-run-id=$source_run_id"
            echo "source-run-attempt=$source_run_attempt"
            echo "pr-number=$pr_number"
          } >> "$GITHUB_OUTPUT"

      - name: Link source checks to this central run
        if: github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source-repository }}
          SOURCE_SHA: ${{ steps.request.outputs.source-ref }}
          RUN_CORE: ${{ steps.request.outputs.run-core }}
          RUN_RPC: ${{ steps.request.outputs.run-rpc }}
          CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            const requested = [
              ['greenways-ci/gwdb-core', process.env.RUN_CORE === 'true'],
              ['greenways-ci/gwdb-rpc', process.env.RUN_RPC === 'true'],
            ];

            for (const [contextName, shouldRun] of requested) {
              if (!shouldRun) continue;
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: process.env.SOURCE_SHA,
                state: 'pending',
                context: contextName,
                description: 'Running in central Greenways CI',
                target_url: process.env.CENTRAL_RUN_URL,
              });
            }

      - name: Check out notified v2 revision
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.request.outputs.source-repository }}
          ref: ${{ steps.request.outputs.source-ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2

      - name: Check out Foundation dependency source
        uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          token: ${{ secrets.GH_TOKEN }}
          path: foundation-base

      - name: Record source revisions
        id: source
        shell: bash
        run: |
          source_sha=$(git -C v2 rev-parse HEAD)
          foundation_sha=$(git -C foundation-base rev-parse HEAD)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "foundation-sha=$foundation_sha" >> "$GITHUB_OUTPUT"
          git -C v2 show --no-patch --format='Source commit: %H%nSubject: %s'
          git -C foundation-base show --no-patch --format='Foundation commit: %H%nSubject: %s'

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Pull shared CI image
        run: docker pull "$CI_IMAGE"

      - name: Prepare persistent Maven repository
        run: mkdir -p "$HOME/.m2"

      - name: Install Foundation modules
        id: foundation
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -v "$HOME/.m2:/root/.m2" \
            "$CI_IMAGE" \
            bash -lc 'set -o pipefail; cd foundation-base && lein install 2>&1 | tee foundation-install.log'

      - name: Compile backend
        id: compile
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -v "$HOME/.m2:/root/.m2" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "$CI_IMAGE" \
            bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend && lein check 2>&1 | tee lein-check.log'

      - name: Run gwdb.core tests
        if: steps.request.outputs.run-core == 'true'
        id: core
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -v "$HOME/.m2:/root/.m2" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "$CI_IMAGE" \
            bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend && lein test :in gwdb.core 2>&1 | tee gwdb-core-test.log'

      - name: Run gwdb.rpc tests
        if: steps.request.outputs.run-rpc == 'true'
        id: rpc
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -v "$HOME/.m2:/root/.m2" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "$CI_IMAGE" \
            bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend && lein test :in gwdb.rpc 2>&1 | tee gwdb-rpc-test.log'

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-gwdb-${{ steps.source.outputs.sha || steps.request.outputs.source-ref }}-${{ github.run_id }}
          path: |
            foundation-base/foundation-install.log
            v2/backend/lein-check.log
            v2/backend/gwdb-core-test.log
            v2/backend/gwdb-rpc-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report source check results
        if: always() && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source-repository }}
          SOURCE_SHA: ${{ steps.request.outputs.source-ref }}
          RUN_CORE: ${{ steps.request.outputs.run-core }}
          RUN_RPC: ${{ steps.request.outputs.run-rpc }}
          FOUNDATION_RESULT: ${{ steps.foundation.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          CORE_RESULT: ${{ steps.core.outcome }}
          RPC_RESULT: ${{ steps.rpc.outcome }}
          CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');

            async function report(contextName, requested, testResult) {
              if (!requested) return;

              const foundationPassed = process.env.FOUNDATION_RESULT === 'success';
              const compilePassed = process.env.COMPILE_RESULT === 'success';
              const testPassed = testResult === 'success';
              const state = foundationPassed && compilePassed && testPassed
                ? 'success'
                : 'failure';
              const description = !foundationPassed
                ? 'Foundation dependency installation failed'
                : !compilePassed
                  ? 'Backend compilation failed'
                  : testPassed
                    ? 'Segment tests passed'
                    : 'Segment tests failed or did not run';

              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: process.env.SOURCE_SHA,
                state,
                context: contextName,
                description,
                target_url: process.env.CENTRAL_RUN_URL,
              });
            }

            await report(
              'greenways-ci/gwdb-core',
              process.env.RUN_CORE === 'true',
              process.env.CORE_RESULT,
            );
            await report(
              'greenways-ci/gwdb-rpc',
              process.env.RUN_RPC === 'true',
              process.env.RPC_RESULT,
            );

      - name: Write backend summary
        if: always()
        shell: bash
        env:
          FOUNDATION_RESULT: ${{ steps.foundation.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          CORE_RESULT: ${{ steps.core.outcome }}
          RPC_RESULT: ${{ steps.rpc.outcome }}
        run: |
          {
            echo '## Greenways v2 segmented gwdb'
            echo
            echo "- correlation: \`${{ steps.request.outputs.correlation-id }}\`"
            echo "- repository: ${{ steps.request.outputs.source-repository }}"
            echo "- requested ref: \`${{ steps.request.outputs.source-ref }}\`"
            echo "- resolved SHA: \`${{ steps.source.outputs.sha || 'not checked out' }}\`"
            echo "- Foundation SHA: \`${{ steps.source.outputs.foundation-sha || 'not checked out' }}\`"
            echo "- source run: ${{ steps.request.outputs.source-run-url || 'manual or central PR' }}"
            echo "- source run ID: ${{ steps.request.outputs.source-run-id || 'n/a' }}"
            echo "- source run attempt: ${{ steps.request.outputs.source-run-attempt || 'n/a' }}"
            echo "- pull request: ${{ steps.request.outputs.pr-number || 'n/a' }}"
            echo "- gwdb.core requested: ${{ steps.request.outputs.run-core }}"
            echo "- gwdb.rpc requested: ${{ steps.request.outputs.run-rpc }}"
            echo "- Foundation install: ${FOUNDATION_RESULT:-skipped}"
            echo "- backend compile: ${COMPILE_RESULT:-skipped}"
            echo "- gwdb.core tests: ${CORE_RESULT:-skipped}"
            echo "- gwdb.rpc tests: ${RPC_RESULT:-skipped}"
            echo "- CI image: $CI_IMAGE"
            echo '- Dependency checkouts: prepared by v2 make deps-checkouts'
            echo '- Foundation artifacts: installed into the shared Maven mount'
            echo '- Database lifecycle: owned by the gw-dev test scaffold'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce requested results
        if: always()
        shell: bash
        env:
          RUN_CORE: ${{ steps.request.outputs.run-core }}
          RUN_RPC: ${{ steps.request.outputs.run-rpc }}
          FOUNDATION_RESULT: ${{ steps.foundation.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          CORE_RESULT: ${{ steps.core.outcome }}
          RPC_RESULT: ${{ steps.rpc.outcome }}
        run: |
          failed=false

          if [[ "$FOUNDATION_RESULT" != "success" ]]; then
            echo 'Foundation module installation failed.' >&2
            failed=true
          fi

          if [[ "$COMPILE_RESULT" != "success" ]]; then
            echo 'Backend compilation failed.' >&2
            failed=true
          fi

          if [[ "$RUN_CORE" == "true" && "$CORE_RESULT" != "success" ]]; then
            echo 'gwdb.core tests failed.' >&2
            failed=true
          fi

          if [[ "$RUN_RPC" == "true" && "$RPC_RESULT" != "success" ]]; then
            echo 'gwdb.rpc tests failed.' >&2
            failed=true
          fi

          [[ "$failed" == "false" ]]

  docs:
    name: Build Docusaurus
    permissions:
      contents: read
      pages: write
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_docs) ||
      github.event.client_payload.segments.docs == true
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.source.outputs.publish }}

    steps:
      - name: Resolve documentation source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          PAYLOAD_SHA: ${{ github.event.client_payload.source_sha }}
          PAYLOAD_REF: ${{ github.event.client_payload.source_ref }}
          PAYLOAD_CORRELATION: ${{ github.event.client_payload.correlation_id }}
          PAYLOAD_SOURCE_RUN_URL: ${{ github.event.client_payload.source_run_url }}
          INPUT_REF: ${{ inputs.source_ref }}
          INPUT_PUBLISH: ${{ inputs.publish_docs }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            repository="greenways-ai/v2"
            ref="${INPUT_REF:-main}"
            publish="${INPUT_PUBLISH:-false}"
            correlation_id="manual:${ref}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            source_run_url=""
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            repository="greenways-ai/v2"
            ref="main"
            publish=false
            correlation_id="central-pr:${GITHUB_SHA}:${GITHUB_RUN_ID}"
            source_run_url=""
          else
            repository="${PAYLOAD_REPOSITORY:-greenways-ai/v2}"
            ref="${PAYLOAD_SHA:-main}"
            correlation_id="${PAYLOAD_CORRELATION:-dispatch:${ref}:${GITHUB_RUN_ID}}"
            source_run_url="$PAYLOAD_SOURCE_RUN_URL"

            if [[ "$PAYLOAD_REF" == "main" ]]; then
              publish=true
            else
              publish=false
            fi
          fi

          [[ "$publish" == "true" ]] || publish=false

          {
            echo "repository=$repository"
            echo "ref=$ref"
            echo "publish=$publish"
            echo "correlation-id=$correlation_id"
            echo "source-run-url=$source_run_url"
          } >> "$GITHUB_OUTPUT"

      - name: Link source documentation check
        if: github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ steps.source.outputs.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.ref }}
          CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.SOURCE_SHA,
              state: 'pending',
              context: 'greenways-ci/docs',
              description: 'Building documentation in central CI',
              target_url: process.env.CENTRAL_RUN_URL,
            });

      - name: Checkout v2 documentation source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install documentation dependencies
        id: install
        continue-on-error: true
        working-directory: v2/docs-gen
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee npm-install.log

      - name: Build documentation
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: v2/docs-gen
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee docusaurus-build.log

      - name: Upload documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-docs-${{ steps.source.outputs.ref }}-${{ github.run_id }}
          path: |
            v2/docs-gen/npm-install.log
            v2/docs-gen/docusaurus-build.log
            v2/docs-gen/build
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        if: steps.source.outputs.publish == 'true' && steps.build.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.source.outputs.publish == 'true' && steps.build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2/docs-gen/build

      - name: Report source documentation result
        if: always() && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ steps.source.outputs.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.ref }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          DOCS_RESULT: ${{ steps.build.outcome }}
          CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            const passed =
              process.env.INSTALL_RESULT === 'success' &&
              process.env.DOCS_RESULT === 'success';

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.SOURCE_SHA,
              state: passed ? 'success' : 'failure',
              context: 'greenways-ci/docs',
              description: passed
                ? 'Documentation build passed'
                : 'Documentation build failed',
              target_url: process.env.CENTRAL_RUN_URL,
            });

      - name: Write documentation summary
        if: always()
        run: |
          {
            echo '## V2 documentation'
            echo
            echo "- correlation: \`${{ steps.source.outputs.correlation-id }}\`"
            echo "- source ref: \`${{ steps.source.outputs.ref }}\`"
            echo "- source run: ${{ steps.source.outputs.source-run-url || 'manual or central PR' }}"
            echo "- install: ${{ steps.install.outcome || 'not run' }}"
            echo "- build: ${{ steps.build.outcome || 'not run' }}"
            echo "- publish requested: ${{ steps.source.outputs.publish }}"
            echo '- Diagnostics: npm-install.log and docusaurus-build.log'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce documentation result
        if: always()
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          DOCS_RESULT: ${{ steps.build.outcome }}
        run: |
          if [[ "$INSTALL_RESULT" != "success" || "$DOCS_RESULT" != "success" ]]; then
            exit 1
          fi

  deploy-docs:
    name: Publish GitHub Pages
    permissions:
      pages: write
      id-token: write
    needs: docs
    if: needs.docs.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4

name: Inspect Hara specs production domain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-hara-specs-domain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-hara-specs-domain
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: statstrade-next
    steps:
      - name: Check out trusted orchestration
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Configure the existing dot-secrets deploy key
        env:
          DOT_SECRETS_SSH_KEY: ${{ secrets.DOT_SECRETS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DOT_SECRETS_SSH_KEY"
          key="$RUNNER_TEMP/dot-secrets-key"
          known_hosts="$RUNNER_TEMP/dot-secrets-known-hosts"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DOT_SECRETS_SSH_KEY" > "$key"
          ssh-keyscan -H github.com > "$known_hosts"
          echo "DOT_SECRETS_GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Check out the pinned provider configuration
        id: secret-revision
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/dot-secrets"
          git init -q "$directory"
          git -C "$directory" remote add origin git@github.com:statstrade-dev/dot-secrets.git
          GIT_SSH_COMMAND="$DOT_SECRETS_GIT_SSH_COMMAND" git -C "$directory" fetch --depth=1 origin main
          git -C "$directory" checkout -q --detach FETCH_HEAD
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$directory" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Load only the allowlisted Netlify provider values
        id: provider-secrets
        run: |
          node ci/.github/scripts/load-env-files.mjs \
            "${{ steps.secret-revision.outputs.directory }}/v2/statstrade/frontend" \
            ci/.github/config/statstrade-frontend-secrets.json

      - name: Inspect exact site, DNS ownership, TLS, and public routing
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.provider-secrets.outputs.NETLIFY_AUTH_TOKEN }}
          NETLIFY_ACCOUNT_SLUG: ${{ steps.provider-secrets.outputs.NETLIFY_ACCOUNT_SLUG }}
          SITE_ID: 357360f1-9f52-45bf-ba0c-9330d389cc14
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          auth=(-H "Authorization: Bearer $NETLIFY_AUTH_TOKEN")

          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.netlify.com/api/v1/sites/$SITE_ID" > "$RUNNER_TEMP/site.json"
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.netlify.com/api/v1/sites/$SITE_ID/dns" > "$RUNNER_TEMP/site-dns.json" || printf '[]' > "$RUNNER_TEMP/site-dns.json"
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.netlify.com/api/v1/dns_zones" > "$RUNNER_TEMP/zones.json" || printf '[]' > "$RUNNER_TEMP/zones.json"
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.netlify.com/api/v1/sites/$SITE_ID/ssl" > "$RUNNER_TEMP/ssl.json" || printf '{}' > "$RUNNER_TEMP/ssl.json"

          test "$(jq -r .id "$RUNNER_TEMP/site.json")" = "$SITE_ID"
          if [[ -n "$NETLIFY_ACCOUNT_SLUG" ]]; then
            test "$(jq -r .account_slug "$RUNNER_TEMP/site.json")" = "$NETLIFY_ACCOUNT_SLUG"
          fi

          echo '--- Netlify site ---'
          jq '{id,name,account_slug,state,url,ssl_url,custom_domain,domain_aliases,force_ssl,managed_dns,ssl,deploy_url,published_deploy:(.published_deploy|if type=="object" then {id,state,url,ssl_url,published_at,commit_ref} else . end)}' "$RUNNER_TEMP/site.json"

          echo '--- Site DNS ---'
          jq '[.[] | {id,name,domain,site_id,dns_servers,errors,records:[.records[]? | select((.hostname // "") | contains("specs")) | {id,hostname,type,value,ttl,managed,site_id}]}]' "$RUNNER_TEMP/site-dns.json"

          echo '--- Netlify DNS zones related to Hara ---'
          jq '[.[] | select(((.name // "") | ascii_downcase | contains("hara")) or ((.domain // "") | ascii_downcase | contains("hara"))) | {id,name,domain,site_id,dns_servers,errors,records:[.records[]? | select((.hostname // "") | contains("specs")) | {id,hostname,type,value,ttl,managed,site_id}]}]' "$RUNNER_TEMP/zones.json"

          echo '--- TLS ---'
          jq '{state,domains,created_at,updated_at,expires_at}' "$RUNNER_TEMP/ssl.json"

          command -v dig >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils; }
          echo '--- Public DNS ---'
          for host in specs.hara-lang.org specs.hara-long.org specs.testing.hara-lang.org specs-hara-lang-io.netlify.app; do
            echo "[$host]"
            printf 'CNAME: '; dig +short "$host" CNAME | tr '\n' ' '; echo
            printf 'A: '; dig +short "$host" A | tr '\n' ' '; echo
            printf 'AAAA: '; dig +short "$host" AAAA | tr '\n' ' '; echo
          done

          echo '--- HTTP identity ---'
          for url in https://specs.hara-lang.org/ https://specs.hara-long.org/ https://specs.testing.hara-lang.org/ https://specs-hara-lang-io.netlify.app/; do
            echo "[$url]"
            curl --silent --show-error --location --head --max-time 20 "$url" | sed -n '1,12p' || true
          done

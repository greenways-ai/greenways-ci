name: _V2 gwdb segment

on:
  workflow_call:
    inputs:
      source_repository:
        description: Source repository in owner/name form
        required: true
        type: string
      source_ref:
        description: Exact source SHA or ref
        required: true
        type: string
      source_run_url:
        description: Source notification run URL
        required: false
        default: ''
        type: string
      source_run_id:
        description: Source notification run ID
        required: false
        default: ''
        type: string
      source_run_attempt:
        description: Source notification run attempt
        required: false
        default: ''
        type: string
      pull_request_number:
        description: Source pull request number
        required: false
        default: ''
        type: string
      correlation_id:
        description: Cross-repository correlation ID
        required: true
        type: string
      selector:
        description: Namespace selector passed to lein test :in
        required: true
        type: string
      segment_name:
        description: Human-readable segment name
        required: true
        type: string
      status_context:
        description: Commit status context on the source SHA
        required: true
        type: string
      artifact_suffix:
        description: Artifact and log name suffix
        required: true
        type: string
      report_status:
        description: Report pending and final source commit statuses
        required: false
        default: false
        type: boolean
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: read

env:
  CI_IMAGE: ghcr.io/zcaudate-xyz/infra-foundation-dev:ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: ${{ inputs.segment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Link source check to this pipeline
        if: inputs.report_status
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          STATUS_CONTEXT: ${{ inputs.status_context }}
          CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.SOURCE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Running in central Greenways CI',
              target_url: process.env.CENTRAL_RUN_URL,
            });

      - name: Check out notified v2 revision
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2

      - name: Resolve pinned Foundation revision
        id: foundation_ref
        shell: bash
        run: |
          set -euo pipefail
          foundation_sha="$(git -C v2 ls-tree HEAD ref/foundation | awk '{print $3}')"
          if [[ -z "$foundation_sha" ]]; then
            echo 'The v2 revision does not contain the ref/foundation gitlink.' >&2
            exit 1
          fi
          echo "sha=$foundation_sha" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Foundation dependency
        uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          ref: ${{ steps.foundation_ref.outputs.sha }}
          token: ${{ secrets.GH_TOKEN }}
          path: foundation-base

      - name: Record correlated revisions
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C v2 rev-parse HEAD)"
          foundation_sha="$(git -C foundation-base rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "foundation_sha=$foundation_sha" >> "$GITHUB_OUTPUT"
          git -C v2 show --no-patch --format='Source commit: %H%nSubject: %s'
          git -C foundation-base show --no-patch --format='Foundation commit: %H%nSubject: %s'

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Pull shared CI image
        run: docker pull "$CI_IMAGE"

      - name: Prepare persistent Maven repository
        run: mkdir -p "$HOME/.m2"

      - name: Install Foundation modules
        id: foundation
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -v "$HOME/.m2:/root/.m2" \
            "$CI_IMAGE" \
            bash -lc 'set -o pipefail; cd foundation-base && lein install 2>&1 | tee foundation-install.log'

      - name: Compile backend
        id: compile
        if: steps.foundation.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -v "$HOME/.m2:/root/.m2" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "$CI_IMAGE" \
            bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend && lein check 2>&1 | tee lein-check.log'

      - name: Run ${{ inputs.segment_name }} tests
        id: segment
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        env:
          TEST_SELECTOR: ${{ inputs.selector }}
          TEST_LOG: ${{ inputs.artifact_suffix }}-test.log
        run: |
          docker run --rm --network host \
            -e TEST_SELECTOR="$TEST_SELECTOR" \
            -e TEST_LOG="$TEST_LOG" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -v "$HOME/.m2:/root/.m2" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "$CI_IMAGE" \
            bash -lc 'set -o pipefail; cd v2 && make deps-checkouts && cd backend && lein test :in "$TEST_SELECTOR" 2>&1 | tee "$TEST_LOG"'

      - name: Upload segment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-${{ inputs.artifact_suffix }}-${{ steps.source.outputs.sha || inputs.source_ref }}-${{ github.run_id }}
          path: |
            foundation-base/foundation-install.log
            v2/backend/lein-check.log
            v2/backend/${{ inputs.artifact_suffix }}-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report source check result
        if: always() && inputs.report_status
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          STATUS_CONTEXT: ${{ inputs.status_context }}
          SEGMENT_NAME: ${{ inputs.segment_name }}
          FOUNDATION_RESULT: ${{ steps.foundation.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.segment.outcome }}
          CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            const foundationPassed = process.env.FOUNDATION_RESULT === 'success';
            const compilePassed = process.env.COMPILE_RESULT === 'success';
            const testsPassed = process.env.TEST_RESULT === 'success';
            const passed = foundationPassed && compilePassed && testsPassed;
            const description = !foundationPassed
              ? 'Foundation dependency installation failed'
              : !compilePassed
                ? 'Backend compilation failed'
                : testsPassed
                  ? `${process.env.SEGMENT_NAME} tests passed`
                  : `${process.env.SEGMENT_NAME} tests failed`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.SOURCE_SHA,
              state: passed ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description,
              target_url: process.env.CENTRAL_RUN_URL,
            });

      - name: Write correlated segment summary
        if: always()
        shell: bash
        env:
          FOUNDATION_RESULT: ${{ steps.foundation.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.segment.outcome }}
        run: |
          {
            echo "## ${{ inputs.segment_name }}"
            echo
            echo "- correlation: \`${{ inputs.correlation_id }}\`"
            echo "- source repository: ${{ inputs.source_repository }}"
            echo "- requested ref: \`${{ inputs.source_ref }}\`"
            echo "- resolved source SHA: \`${{ steps.source.outputs.sha || 'not checked out' }}\`"
            echo "- pinned Foundation SHA: \`${{ steps.source.outputs.foundation_sha || steps.foundation_ref.outputs.sha || 'not resolved' }}\`"
            echo "- source run: ${{ inputs.source_run_url || 'manual or central PR' }}"
            echo "- source run ID: ${{ inputs.source_run_id || 'n/a' }}"
            echo "- source run attempt: ${{ inputs.source_run_attempt || 'n/a' }}"
            echo "- pull request: ${{ inputs.pull_request_number || 'n/a' }}"
            echo "- selector: \`${{ inputs.selector }}\`"
            echo "- Foundation install: ${FOUNDATION_RESULT:-not run}"
            echo "- backend compile: ${COMPILE_RESULT:-not run}"
            echo "- tests: ${TEST_RESULT:-not run}"
            echo "- CI image: $CI_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce segment result
        if: always()
        shell: bash
        env:
          FOUNDATION_RESULT: ${{ steps.foundation.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.segment.outcome }}
        run: |
          if [[ "$FOUNDATION_RESULT" != 'success' || "$COMPILE_RESULT" != 'success' || "$TEST_RESULT" != 'success' ]]; then
            exit 1
          fi

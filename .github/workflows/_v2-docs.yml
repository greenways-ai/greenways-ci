name: _V2 docs and build portal

on:
  workflow_call:
    inputs:
      source_repository: {required: true, type: string}
      source_ref: {required: true, type: string}
      publish: {required: false, default: false, type: boolean}
      deploy_preview: {required: false, default: false, type: boolean}
      report_status: {required: false, default: false, type: boolean}
    secrets:
      GH_TOKEN: {required: true}
      NETLIFY_AUTH_TOKEN: {required: false}
      NETLIFY_SITE_ID: {required: false}

permissions:
  contents: read

jobs:
  build:
    name: Docusaurus and Build Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Build business-plan PDFs
        working-directory: v2
        run: |
          docs/business-plan/install-deps.sh
          make -C docs/business-plan publish
          test -f docs-gen/static/documents/business-plan/business-plan.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/bondi-surf-life-saving-club.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/community-strong-australia.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/city2surf-organisers.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/australian-red-cross-community-readiness.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/reckless-ben-bricks-and-minifigs-accountability.pdf
      - name: Install frontend dependencies
        working-directory: v2/main
        run: corepack yarn install --immutable
      - name: Build documentation and portal
        id: build
        continue-on-error: true
        working-directory: v2
        env:
          DEPLOY_CONTEXT: ${{ inputs.publish && 'production' || 'deploy-preview' }}
        run: |
          cp main/apps/statstrade-build/netlify.toml netlify.toml
          trap 'rm -f netlify.toml' EXIT
          npx --yes netlify-cli@26.2.0 build --offline --filter @statstrade/build-portal --context "$DEPLOY_CONTEXT"
          test -f main/.netlify/static/docs/index.html
          test -d main/.netlify/static/_next/static
          test -f main/.netlify/functions/manifest.json
          test -f main/.netlify/functions/identity.zip
          test -f main/.netlify/functions/___netlify-server-handler.zip
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-build-portal-${{ github.run_id }}
          path: |
            v2/main/apps/statstrade-build/public/docs
            v2/main/apps/statstrade-build/.next/BUILD_ID
            v2/main/apps/statstrade-build/.next/build-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - if: steps.build.outcome == 'success' && (inputs.publish || inputs.deploy_preview)
        uses: actions/upload-artifact@v4
        with:
          name: v2-build-portal-netlify-${{ github.run_id }}
          path: v2/main/.netlify
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - if: always() && inputs.report_status
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          RESULT: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            const passed = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({owner, repo, sha: process.env.SOURCE_SHA, state: passed ? 'success' : 'failure', context: 'greenways-ci/docs', description: passed ? 'Build Portal passed' : 'Build Portal failed', target_url: process.env.RUN_URL});
      - if: always()
        env:
          RESULT: ${{ steps.build.outcome }}
        run: test "$RESULT" = success

  deploy:
    name: Deploy Build Portal
    if: inputs.publish || inputs.deploy_preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish && 'build-portal-production' || 'build-portal-preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: v2-build-portal-netlify-${{ github.run_id }}
          path: v2/main/.netlify
      - name: Validate Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: test -n "$NETLIFY_AUTH_TOKEN" && test -n "$NETLIFY_SITE_ID"
      - name: Deploy to Netlify
        id: netlify
        working-directory: v2
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_KIND: ${{ inputs.publish && '--prod' || '' }}
        run: |
          cp main/apps/statstrade-build/netlify.toml netlify.toml
          trap 'rm -f netlify.toml' EXIT
          deploy_output=$(npx --yes netlify-cli@26.2.0 deploy $DEPLOY_KIND \
            --filter @statstrade/build-portal \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --no-build \
            --dir main/.netlify/static --functions main/.netlify/functions \
            --message "Build Portal from ${{ inputs.source_repository }}@${{ inputs.source_ref }}" \
            --json)
          printf '%s\n' "$deploy_output" | tee deploy.json
          echo "url=$(jq -r '.deploy_url // .deployUrl // .url' deploy.json)" >> "$GITHUB_OUTPUT"
      - name: Publish deploy summary
        env:
          DEPLOY_URL: ${{ steps.netlify.outputs.url }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          {
            echo '## Statstrade Build Portal'
            echo
            echo "- source: \`$SOURCE_REF\`"
            echo "- deploy: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"

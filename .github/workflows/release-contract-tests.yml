name: Statstrade release contract tests

on:
  pull_request:
    paths:
      - '.github/scripts/statstrade-production*'
      - '.github/workflows/statstrade-production.yml'
      - '.github/workflows/release-contract-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/statstrade-production*'
      - '.github/workflows/statstrade-production.yml'
      - '.github/workflows/release-contract-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/statstrade-production.test.cjs
